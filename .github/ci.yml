name: CI - Build & Push Strapi Image to ECR

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/paktha-my-strapi-repo-1:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/paktha-my-strapi-repo-1:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/paktha-my-strapi-repo-1:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/paktha-my-strapi-repo-1:latest
